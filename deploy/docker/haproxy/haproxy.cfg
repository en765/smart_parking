global
    log stdout format raw local0

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_in
    bind *:80
    acl is_api path_beg /api
    acl is_websocket hdr(Upgrade) -i websocket
    use_backend backend_servers if is_api or is_websocket
    default_backend frontend_servers

backend frontend_servers
    server frontend frontend:8080 check

backend backend_servers
    timeout tunnel 1h
    server backend backend:3000 check
